spring:
  application:
    name: testflow-worker
  main:
    web-application-type: none
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${TF_DB_URL}
    username: ${TF_DB_USERNAME}
    password: ${TF_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 15000
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 5000
  flyway:
    enabled: false
  sql:
    init:
      mode: never
mybatis:
  configuration:
    default-statement-timeout: 2
    map-underscore-to-camel-case: true
logging:
  level:
    com.testflow.persistence: INFO

