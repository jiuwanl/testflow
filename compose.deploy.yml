name: testflow-deploy
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-restricted: &restricted
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  logging: *bounded-logging
x-java-env: &java-env
  SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  TF_DB_URL: jdbc:mysql://mysql:3306/testflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
  TF_CONTROL_PORTS: "18081"
services:
  mysql:
    logging: *bounded-logging
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: "%"
    secrets: [mysql_root_password]
    command:
      [
        --character-set-server=utf8mb4,
        --collation-server=utf8mb4_0900_ai_ci,
        --default-time-zone=+00:00,
        --innodb-buffer-pool-size=268435456,
        --max-connections=60,
      ]
    volumes: [mysql_deploy:/var/lib/mysql]
    networks: [database]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql -uroot -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 25s
  redis:
    logging: *bounded-logging
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_config, redis_password]
    volumes: [redis_deploy:/data]
    networks: [control]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
  db-init:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    entrypoint: [sh, /init/db-init.sh]
    volumes: [./deploy/db-init.sh:/init/db-init.sh:ro]
    secrets:
      [mysql_root_password, api_password, worker_password, migration_password]
    networks: [database]
    depends_on:
      mysql: { condition: service_healthy }
  api:
    <<: *restricted
    build:
      { context: ., dockerfile: deploy/Dockerfile.java, args: { APP: api } }
    image: testflow-api:local
    environment:
      <<: *java-env
      TF_BIND_ADDRESS: 0.0.0.0
      TF_DB_USERNAME: tf_api
      TF_MIGRATION_DB_USERNAME: tf_migrator
      TF_REDIS_HOST: redis
      TF_QUALITY_ENABLED: "true"
      TF_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TF_BOOTSTRAP_ADMIN_USERNAME: admin
      TF_SESSION_NAMESPACE: testflow:deploy:session
      TF_LOGIN_RATE_PREFIX: testflow:deploy:login
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=96m
    secrets:
      - { source: api_password, target: TF_DB_PASSWORD }
      - { source: migration_password, target: TF_MIGRATION_DB_PASSWORD }
      - { source: redis_password, target: TF_REDIS_PASSWORD }
      - { source: admin_password, target: TF_BOOTSTRAP_ADMIN_PASSWORD }
      - { source: secret_key, target: TF_SECRET_KEY }
      - { source: snapshot_hmac_key, target: TF_SNAPSHOT_HMAC_KEY }
    volumes: [./deploy/health-api.sh:/app/health.sh:ro]
    networks: [database, control, web]
    mem_limit: 768m
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, bash, /app/health.sh]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 45s
  worker-grants:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    entrypoint: [sh, /init/worker-grants.sh]
    volumes: [./deploy/worker-grants.sh:/init/worker-grants.sh:ro]
    secrets: [mysql_root_password]
    networks: [database]
    depends_on:
      api: { condition: service_healthy }
  worker:
    <<: *restricted
    build:
      { context: ., dockerfile: deploy/Dockerfile.java, args: { APP: worker } }
    image: testflow-worker:local
    environment:
      <<: *java-env
      TF_DB_USERNAME: tf_worker
      TF_WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=64m
    secrets:
      - { source: worker_password, target: TF_DB_PASSWORD }
      - { source: secret_key, target: TF_SECRET_KEY }
      - { source: snapshot_hmac_key, target: TF_SNAPSHOT_HMAC_KEY }
    volumes: [./deploy/health-worker.sh:/app/health.sh:ro]
    networks: [database, execution]
    mem_limit: 512m
    stop_grace_period: 35s
    depends_on:
      worker-grants: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, sh, /app/health.sh]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 30s
  nginx:
    <<: *restricted
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    image: testflow-web:local
    ports: ["127.0.0.1:18081:8080"]
    networks: [web, ingress]
    mem_limit: 96m
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka-volume-init:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    user: "0:0"
    entrypoint: [sh, -c, "chown 1000:1000 /data"]
    volumes: [kafka_deploy:/data]
    network_mode: none
  kafka:
    logging: *bounded-logging
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: kCKgqGq3T--IzGp2X9Q9Ng
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_DIRS: /data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka_deploy:/data]
    networks: [control]
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      kafka-volume-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s
  kafka-topic-init:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    entrypoint:
      [
        /opt/kafka/bin/kafka-topics.sh,
        --bootstrap-server,
        kafka:9092,
        --create,
        --if-not-exists,
        --topic,
        testflow.run-finalized.v1,
        --partitions,
        "1",
        --replication-factor,
        "1",
        --config,
        retention.ms=604800000,
        --config,
        retention.bytes=268435456,
        --config,
        max.message.bytes=32768,
      ]
    networks: [control]
    depends_on:
      kafka: { condition: service_healthy }
  demo-target:
    <<: *restricted
    profiles: [demo]
    build: { context: ., dockerfile: deploy/Dockerfile.demo }
    image: testflow-demo:local
    networks: [execution]
    mem_limit: 192m
networks:
  ingress: {}
  database: { internal: true }
  control: { internal: true }
  web: { internal: true }
  execution: {}
volumes:
  mysql_deploy:
  redis_deploy:
  kafka_deploy:
secrets:
  mysql_root_password: { file: ./.local/deploy-secrets/mysql_root_password }
  api_password: { file: ./.local/deploy-secrets/api_password }
  worker_password: { file: ./.local/deploy-secrets/worker_password }
  migration_password: { file: ./.local/deploy-secrets/migration_password }
  redis_password: { file: ./.local/deploy-secrets/redis_password }
  redis_config: { file: ./.local/deploy-secrets/redis_config }
  admin_password: { file: ./.local/deploy-secrets/admin_password }
  secret_key: { file: ./.local/deploy-secrets/secret_key }
  snapshot_hmac_key: { file: ./.local/deploy-secrets/snapshot_hmac_key }
